name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Both the browser component tests and the end-to-end suite need Chromium.
      - run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run check

      - name: Unit and component tests
        run: npx vitest run

      # Builds the app and serves the production bundle, as the e2e config says.
      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
