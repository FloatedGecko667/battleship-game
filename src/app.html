<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<!-- Static, like the manifest link: with ssr disabled the version set in
		     svelte:head only lands after hydration, so the shell would otherwise
		     ship with no title at all. -->
		<title>Firing Solution</title>
		<meta
			name="description"
			content="Work out where the enemy fleet is, one shot at a time. Plays fully offline."
		/>
		<!-- Static, so the app is installable from the first paint rather than
		     only once the client has hydrated. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
